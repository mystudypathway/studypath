<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Researcher Dashboard — SPM Pathway Data Collector</title>
<link rel="stylesheet" href="../css/style.css" />
<script src="vendor/chart.umd.min.js"></script>
<style>
  body { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .dash-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  .stat-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:22px; }
  @media (max-width: 760px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; }
  .stat-card .num { font-size:1.6rem; font-weight:700; color:var(--primary); }
  .stat-card .lbl { font-size:0.82rem; color:var(--text-muted); }
  .chart-grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:22px; }
  @media (max-width: 760px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px; }
  .chart-card h3 { margin:0 0 10px; font-size:0.95rem; color:var(--primary); }
  table { width:100%; border-collapse: collapse; font-size:0.85rem; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { background:#f0f2f5; position: sticky; top:0; }
  .table-wrap { overflow-x:auto; background:#fff; border:1px solid var(--border); border-radius:12px; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar select { width:auto; }
  .tag { padding:2px 8px; border-radius:10px; font-size:0.75rem; }
  .tag-active { background:#e5f4ea; color:var(--success); }
  .tag-flagged { background:#fdecea; color:var(--accent); }
  .row-actions button { font-size:0.75rem; padding:4px 8px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; margin-right:4px; }
  .pagination { display:flex; gap:8px; align-items:center; justify-content:center; padding:12px; }
  section { margin-bottom: 26px; }
</style>
</head>
<body>
  <div class="dash-header">
    <div>
      <h1 style="margin:0;color:var(--primary);">Researcher Dashboard</h1>
      <p style="margin:2px 0 0;color:var(--text-muted);font-size:0.88rem;">SPM Pathway Data Collector — logged in as <b id="whoami"></b></p>
    </div>
    <div>
      <button class="btn btn-secondary" id="exportBtn">Export CSV</button>
      <button class="btn btn-secondary" id="logoutBtn">Log out</button>
    </div>
  </div>

  <section class="stat-grid" id="statGrid"></section>

  <section class="chart-grid">
    <div class="chart-card"><h3>Post-SPM pathway distribution</h3><canvas id="chartPathway" height="220"></canvas></div>
    <div class="chart-card"><h3>Respondent type (leaver vs Form 5)</h3><canvas id="chartType" height="220"></canvas></div>
    <div class="chart-card"><h3>Income classification (B40/M40/T20)</h3><canvas id="chartStratum" height="220"></canvas></div>
    <div class="chart-card"><h3>Responses over time</h3><canvas id="chartTime" height="220"></canvas></div>
  </section>

  <section>
    <div class="toolbar">
      <label>Status:
        <select id="filterStatus">
          <option value="active">Active</option>
          <option value="flagged">Flagged</option>
          <option value="all">All</option>
        </select>
      </label>
      <label>Type:
        <select id="filterType">
          <option value="all">All</option>
          <option value="leaver">Leaver</option>
          <option value="form5">Form 5</option>
        </select>
      </label>
    </div>
    <div class="table-wrap">
      <table id="respTable">
        <thead>
          <tr>
            <th>ID</th><th>Code</th><th>Submitted</th><th>Status</th><th>Type</th>
            <th>Gender</th><th>Stratum</th><th>School type</th><th>Pathway</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="respBody"></tbody>
      </table>
    </div>
    <div class="pagination">
      <button class="btn btn-secondary" id="prevPage">Prev</button>
      <span id="pageInfo"></span>
      <button class="btn btn-secondary" id="nextPage">Next</button>
    </div>
  </section>

  <section class="card">
    <h2>Account</h2>
    <div id="pwMsg"></div>
    <div class="field-row"><label class="field-label">Current password</label><input type="password" id="curPw" /></div>
    <div class="field-row"><label class="field-label">New password (min 8 chars)</label><input type="password" id="newPw" /></div>
    <button class="btn btn-primary" id="changePwBtn">Change password</button>
  </section>

<script src="admin.js"></script>
</body>
</html>
