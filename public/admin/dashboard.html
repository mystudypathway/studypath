<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Researcher Dashboard — SPM Pathway Data Collector</title>
<link rel="stylesheet" href="../css/style.css" />
<script src="vendor/chart.umd.min.js"></script>
<style>
  body { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  .dash-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:14px; }
  .dash-header .who { margin:2px 0 0; color:var(--text-muted); font-size:0.88rem; }
  .stat-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:22px; }
  @media (max-width: 760px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; text-align:center; box-shadow:var(--shadow); }
  .stat-card .num { font-size:1.9rem; font-weight:800; line-height:1.1; }
  .stat-card .lbl { font-size:0.72rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-muted); margin-top:6px; }
  .stat-card:nth-child(1) .num { color: var(--primary); }
  .stat-card:nth-child(2) .num { color: var(--accent); }
  .stat-card:nth-child(3) .num { color: var(--purple); }
  .stat-card:nth-child(4) .num { color: var(--amber); }

  .chart-grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:22px; }
  @media (max-width: 760px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
  .chart-card h3 { margin:0 0 12px; font-size:0.92rem; font-weight:700; color:var(--text); }

  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar label { font-size:0.85rem; font-weight:600; color:var(--text-muted); display:flex; align-items:center; gap:8px; }
  .toolbar select { width:auto; padding:9px 14px; border-radius:var(--radius-pill); }

  .resp-list { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .resp-row {
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:14px 16px; box-shadow:var(--shadow); flex-wrap:wrap;
  }
  .resp-avatar {
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    background:var(--primary-tint); color:var(--primary);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:0.95rem;
  }
  .resp-main { flex:1; min-width:180px; }
  .resp-title { font-weight:700; font-size:0.92rem; color:var(--text); }
  .resp-sub { font-size:0.78rem; color:var(--text-muted); margin-top:2px; }
  .resp-meta { font-size:0.85rem; color:var(--text); text-align:right; min-width:120px; }
  .resp-meta .pathway { font-weight:600; }
  .resp-actions { display:flex; gap:8px; }
  .resp-actions button {
    font-size:0.75rem; font-weight:700; font-family:inherit;
    padding:7px 14px; border-radius:var(--radius-pill);
    border:1.5px solid var(--border); background:#fff; cursor:pointer;
  }
  .resp-actions button:hover { background:#f7f8fa; }
  .resp-actions button.danger { border-color:#f5c6cb; color:var(--accent); background:var(--accent-tint); }
  .resp-actions button.danger:hover { background:#fbdada; }

  .tag { padding:4px 11px; border-radius:var(--radius-pill); font-size:0.7rem; font-weight:700; letter-spacing:0.02em; }
  .tag-active { background:var(--primary-tint); color:var(--primary); }
  .tag-flagged { background:var(--accent-tint); color:var(--accent); }

  .pagination { display:flex; gap:10px; align-items:center; justify-content:center; padding:12px; }
  .pagination span { font-size:0.85rem; color:var(--text-muted); font-weight:600; }
  section { margin-bottom: 26px; }
</style>
</head>
<body>
  <div class="dash-header">
    <div class="brand">
      <span class="brand-mark">🎓</span>
      <div>
        <span class="brand-name">Researcher Dashboard</span>
        <p class="who">SPM Pathway Data Collector — logged in as <b id="whoami"></b></p>
      </div>
    </div>
    <div>
      <button class="btn btn-secondary" id="exportBtn">Export CSV</button>
      <button class="btn btn-secondary" id="logoutBtn">Log out</button>
    </div>
  </div>

  <section class="stat-grid" id="statGrid"></section>

  <section class="chart-grid">
    <div class="chart-card"><h3>Post-SPM pathway distribution</h3><canvas id="chartPathway" height="220"></canvas></div>
    <div class="chart-card"><h3>Respondent type (leaver vs Form 5)</h3><canvas id="chartType" height="220"></canvas></div>
    <div class="chart-card"><h3>Income classification (B40/M40/T20)</h3><canvas id="chartStratum" height="220"></canvas></div>
    <div class="chart-card"><h3>Responses over time</h3><canvas id="chartTime" height="220"></canvas></div>
  </section>

  <section>
    <div class="toolbar">
      <label>Status
        <select id="filterStatus">
          <option value="active">Active</option>
          <option value="flagged">Flagged</option>
          <option value="all">All</option>
        </select>
      </label>
      <label>Type
        <select id="filterType">
          <option value="all">All</option>
          <option value="leaver">Leaver</option>
          <option value="form5">Form 5</option>
        </select>
      </label>
    </div>
    <div class="resp-list" id="respList"></div>
    <div class="pagination">
      <button class="btn btn-secondary" id="prevPage">Prev</button>
      <span id="pageInfo"></span>
      <button class="btn btn-secondary" id="nextPage">Next</button>
    </div>
  </section>

  <section class="card">
    <h2>Account</h2>
    <div id="pwMsg"></div>
    <div class="field-row"><label class="field-label">Current password</label><input type="password" id="curPw" /></div>
    <div class="field-row"><label class="field-label">New password (min 8 chars)</label><input type="password" id="newPw" /></div>
    <button class="btn btn-primary" id="changePwBtn">Change password</button>
  </section>

<script src="admin.js"></script>
</body>
</html>
