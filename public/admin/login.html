<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — SPM Pathway Data Collector</title>
<link rel="icon" href="../images/favicon.png" type="image/png" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-wrap { max-width: 380px; width: 100%; padding: 0 16px; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand" style="justify-content:center;margin-bottom:22px;">
      <span class="brand-mark"><img src="../images/umk-logo.png" alt="Universiti Malaysia Kelantan logo" /></span>
      <div>
        <div class="brand-name">SPM Pathway</div>
        <div class="brand-sub">Universiti Malaysia Kelantan</div>
      </div>
    </div>
    <div class="card">
      <h2>Researcher Admin Login</h2>
      <div id="errBox"></div>
      <div class="field-row">
        <label class="field-label">Username</label>
        <input type="text" id="username" autocomplete="username" />
      </div>
      <div class="field-row">
        <label class="field-label">Password</label>
        <input type="password" id="password" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" style="width:100%" id="loginBtn">Log in</button>
      <p class="helper-text">Default account is <code>admin</code> / <code>ChangeMe123!</code> unless changed in your .env file. Change the password after first login.</p>
    </div>
  </div>

<script>
document.getElementById("loginBtn").addEventListener("click", async () => {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const errBox = document.getElementById("errBox");
  errBox.innerHTML = "";
  try {
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!data.ok) {
      errBox.innerHTML = `<div class="error-box">${data.error || "Login failed"}</div>`;
      return;
    }
    window.location.href = "dashboard.html";
  } catch (e) {
    errBox.innerHTML = `<div class="error-box">Network error. Please try again.</div>`;
  }
});
document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("loginBtn").click();
});
</script>
</body>
</html>
